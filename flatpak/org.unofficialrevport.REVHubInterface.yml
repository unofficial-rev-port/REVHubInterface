id: org.unofficialrevport.REVHubInterface
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: REVHubInterface.sh
finish-args:
  - --device=all
  - --share=ipc
  - --socket=x11
modules:
  - python3-requirements.json
  - name: tkinter
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=${FLATPAK_DEST} --no-build-isolation .
    sources:
      - type: git
        url: https://github.com/iwalton3/tkinter-standalone
        commit: 8e78e38ef0cceb44a3a0062e1c314a4ff3f981db
    modules:
      - name: tcl9.0
        subdir: unix
        config-opts:
          - --disable-zipfs
        post-install:
          - chmod +w ${FLATPAK_DEST}/lib/libtcl9.0.so
        sources:
          - type: archive
            url: https://prdownloads.sourceforge.net/tcl/tcl9.0.2-src.tar.gz
            sha256: e074c6a8d9ba2cddf914ba97b6677a552d7a52a3ca102924389a05ccb249b520
            x-checker-data:
              type: html
              url: https://sourceforge.net/projects/tcl/rss
              pattern: <link>(https://sourceforge.net/.+/tcl(8\\.6\\.[\\d\\.]*\\d)-src.tar.gz)/download
      - name: tk9.0
        subdir: unix
        config-opts:
          - --disable-zipfs
        post-install:
          - chmod +w ${FLATPAK_DEST}/lib/libtcl9tk9.0.so
        sources:
          - type: archive
            url: https://prdownloads.sourceforge.net/tcl/tk9.0.2-src.tar.gz
            sha256: 76fb852b2f167592fe8b41aa6549ce4e486dbf3b259a269646600e3894517c76
            x-checker-data:
              type: html
              url: https://sourceforge.net/projects/tcl/rss
              pattern: <link>(https://sourceforge.net/.+/tk(8\\.6\\.[\\d\\.]*\\d)-src.tar.gz)/download
  - name: revhubinterface
    buildsystem: simple
    build-commands:
      - python -m setuptools_scm --force-write-version-files
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} . --no-build-isolation
      - install -Dm755 REVHubInterface.sh /app/bin/REVHubInterface.sh
      - install -Dm644 -t /app/share/applications flatpak/org.unofficialrevport.REVHubInterface.desktop
      - install -Dm644 -t /app/share/icons/hicolor/scalable/apps org.unofficialrevport.REVHubInterface.svg
      - install -Dm644 -t /app/share/metainfo org.unofficialrevport.REVHubInterface.metainfo.xml
    sources:
      - type: dir
        path: ../
